name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on bash scripts
        run: |
          shellcheck -x commands config install functions
          find subcommands -type f -exec shellcheck -x {} +

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Dokku
        run: |
          wget -NP . https://dokku.com/install/v0.35.15/bootstrap.sh
          sudo DOKKU_TAG=v0.35.15 bash bootstrap.sh
          sudo usermod -aG docker $USER
          echo "$USER ALL=(ALL) NOPASSWD: /usr/bin/dokku" | sudo tee /etc/sudoers.d/dokku-runner

      - name: Install snapshot plugin
        run: |
          # Install via Dokku's plugin:install using file:// URL so basher/plugn
          # dispatch is properly registered (manual file copy breaks basher dispatch)
          sudo dokku plugin:install "file://$GITHUB_WORKSPACE" snapshot || true
          sudo mkdir -p /var/lib/dokku/data/snapshot
          sudo chown -R dokku:dokku /var/lib/dokku/data/snapshot

      - name: Install dokku-postgres
        run: |
          sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres || true

      - name: Verify plugins
        run: |
          sudo dokku snapshot:help
          sudo dokku postgres:help
          sudo dokku apps:list
          # Test postgres:create from bash (no trace, no redirects)
          echo "=== Testing postgres:create from bash ==="
          sudo dokku postgres:create bash-test-svc || echo "BASH EXIT CODE: $?"
          sudo dokku postgres:exists bash-test-svc && echo "SERVICE EXISTS" || echo "SERVICE MISSING"
          sudo dokku postgres:destroy bash-test-svc --force 2>/dev/null || true
          # Test postgres:create from Node.js (same as tests)
          echo "=== Testing postgres:create from Node.js ==="
          node -e "
            const { execSync } = require('child_process');
            try {
              const r = execSync('sudo dokku postgres:create node-test-svc', { encoding: 'utf-8' });
              console.log('SUCCESS stdout:', JSON.stringify(r));
            } catch (e) {
              console.log('FAILED exit:', e.status);
              console.log('FAILED stdout:', JSON.stringify(e.stdout));
              console.log('FAILED stderr:', JSON.stringify(e.stderr));
            }
          "
          sudo dokku postgres:exists node-test-svc && echo "NODE SERVICE EXISTS" || echo "NODE SERVICE MISSING"
          sudo dokku postgres:destroy node-test-svc --force 2>/dev/null || true

      - name: Run integration tests
        run: npm run test:integration
        env:
          DOKKU_HOST: local
          DOKKU_USE_SUDO: 'true'

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Dokku logs ==="
          sudo dokku logs:failed 2>/dev/null || true
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Snapshot data ==="
          sudo ls -laR /var/lib/dokku/data/snapshot/ 2>/dev/null || true
