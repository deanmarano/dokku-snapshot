name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on bash scripts
        run: |
          shellcheck -x commands config install functions
          find subcommands -type f -exec shellcheck -x {} +

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Dokku
        run: |
          wget -NP . https://dokku.com/install/v0.35.15/bootstrap.sh
          sudo DOKKU_TAG=v0.35.15 bash bootstrap.sh
          sudo usermod -aG docker $USER
          echo "$USER ALL=(ALL) NOPASSWD: /usr/bin/dokku" | sudo tee /etc/sudoers.d/dokku-runner

      - name: Install snapshot plugin
        run: |
          # Install via Dokku's plugin:install using file:// URL so basher/plugn
          # dispatch is properly registered (manual file copy breaks basher dispatch)
          sudo dokku plugin:install "file://$GITHUB_WORKSPACE" snapshot || true
          sudo mkdir -p /var/lib/dokku/data/snapshot
          sudo chown -R dokku:dokku /var/lib/dokku/data/snapshot

      - name: Install dokku-postgres
        run: |
          sudo dokku plugin:install https://github.com/dokku/dokku-postgres.git postgres || true

      - name: Verify plugins
        run: |
          sudo dokku snapshot:help
          sudo dokku postgres:help
          sudo dokku apps:list
          # Debug: test stdio modes from Node.js
          echo "=== Testing spawnSync with stdio inherit ==="
          node -e "
            const { spawnSync } = require('child_process');
            const r = spawnSync('sudo', ['dokku', 'postgres:create', 'inherit-test-svc'], { stdio: 'inherit' });
            console.log('INHERIT EXIT:', r.status);
          "
          sudo dokku postgres:exists inherit-test-svc && echo "INHERIT SERVICE EXISTS" || echo "INHERIT SERVICE MISSING"
          sudo dokku postgres:destroy inherit-test-svc --force 2>/dev/null || true
          echo "=== Testing spawnSync with explicit stdin ==="
          node -e "
            const { spawnSync } = require('child_process');
            const r = spawnSync('sudo', ['dokku', 'postgres:create', 'stdin-test-svc'], {
              encoding: 'utf-8',
              stdio: ['inherit', 'pipe', 'pipe']
            });
            console.log('STDIN EXIT:', r.status);
            console.log('STDIN STDOUT:', JSON.stringify(r.stdout?.slice(0,200)));
            console.log('STDIN STDERR:', JSON.stringify(r.stderr?.slice(0,200)));
          "
          sudo dokku postgres:exists stdin-test-svc && echo "STDIN SERVICE EXISTS" || echo "STDIN SERVICE MISSING"
          sudo dokku postgres:destroy stdin-test-svc --force 2>/dev/null || true

      - name: Run integration tests
        run: npm run test:integration
        env:
          DOKKU_HOST: local
          DOKKU_USE_SUDO: 'true'

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Dokku logs ==="
          sudo dokku logs:failed 2>/dev/null || true
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Snapshot data ==="
          sudo ls -laR /var/lib/dokku/data/snapshot/ 2>/dev/null || true
